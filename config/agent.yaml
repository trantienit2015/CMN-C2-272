# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level. Nesting them under an
# `agent:` block makes them invisible to the registry: namespace and enabled
# fall back to defaults and name/version never resolve.
id: "CMN-C2-272"
name: "ServiceNow Change Request Approve Agent"
namespace: "cmn"
version: "0.1.0"
enabled: true
category: "Cat 2"
industry: "CMN"

# Step 8e: ChangeRiskAssessNode layers an optional LLM-generated rationale on
# top of the unchanged deterministic risk verdict. Any LLM failure degrades
# silently (no risk_rationale field) — the verdict itself never depends on it.
generation_mode: "llm"

# Base pattern reference (L1-direct inheritance; not an import target)
base_type: "ChatAgent"

# Entry point — a single dotted import path (module.Class), not a module:/class:
# split. AgentRegistry does class.rsplit(".", 1) to get (module, class_name).
class: "src.graph.graph.Graph"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates. Both lists are declared explicitly.
# secrets: ChangeRiskAssessNode resolves these via ctx.secrets.require() to build
# an AzureOpenAIClient per-invocation (Step 8e rationale enhancement). Missing at
# runtime degrades to no risk_rationale, not a compile failure — the compile-time
# check only proves the deployment provisioned them, not that they are used.
# extras: "openai" installs AzureOpenAIClient's langchain_openai dependency.
requires:
  secrets: ["AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]

# Runtime parameters live in config/config.yaml. AgentRegistry loads that file
# separately and passes its contents as Graph(config=...).
